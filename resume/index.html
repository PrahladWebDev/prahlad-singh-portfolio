<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume | Prahlad Singh — Full-Stack MERN/MEVN Developer</title>
<meta name="description" content="Resume of Prahlad Singh, full-stack MERN/MEVN developer based in Gurgaon, India. View online or download the PDF.">
<link rel="canonical" href="https://prahladsingh.in/resume">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#fff7ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<script>
/* same auto day/night logic as the main site */
(function(){try{var s=localStorage.getItem('prahlad-portfolio-theme-v3')||'auto';if(s==='auto'){var h=new Date().getHours();s=(h>=6&&h<18)?'cloud':'midnight';}
var night=['midnight','dracula','forest','nord','synthwave'].indexOf(s)>-1;document.documentElement.setAttribute('data-mode',night?'night':'day');
var m=document.querySelector('meta[name="theme-color"]');if(m&&night)m.setAttribute('content','#0b1020');}catch(e){}})();
</script>
<style>
:root{--bg:#fff7ec;--card:#fff;--text:#3d3560;--muted:#6a6288;--ink:#3d3560;--shc:#3d3560;--accent:#ff8f7a;--butter:#ffe9a6;--pink:#ffc2d4;--mint:#bfeedd;--sky:#bfe3ff;--lilac:#dccfff;--glow:.4;--dot:rgba(61,53,96,.10)}
html[data-mode="night"]{--bg:#0b1020;--card:#141b33;--text:#ece9ff;--muted:#a7a3c9;--ink:#8f89d4;--shc:rgba(0,0,0,.55);--accent:#f2a93b;--glow:.12;--dot:rgba(255,255,255,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:
 radial-gradient(circle at 12% 10%,color-mix(in srgb,var(--pink) calc(var(--glow)*100%),transparent) 0,transparent 38%),
 radial-gradient(circle at 90% 20%,color-mix(in srgb,var(--sky) calc(var(--glow)*100%),transparent) 0,transparent 34%),
 radial-gradient(circle at 70% 95%,color-mix(in srgb,var(--mint) calc(var(--glow)*100%),transparent) 0,transparent 36%),var(--bg);
 display:flex;flex-direction:column;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:26px 26px;pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px}
.title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(18px,3vw,24px)}
.title em{font-style:normal;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--butter) 80%,transparent) 58%,color-mix(in srgb,var(--butter) 80%,transparent) 92%,transparent 92%);padding:0 .12em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--text);font:800 13px 'Nunito',sans-serif;text-decoration:none;box-shadow:4px 4px 0 var(--shc);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,background .18s}
.btn.p{background:var(--accent);color:#3a3260}
.btn:hover{transform:translate(-2px,-4px) rotate(-1.5deg);box-shadow:6px 8px 0 var(--shc);background:var(--butter);color:#3a3260}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shc)}
.btn:focus-visible{outline:3px solid #7458d8;outline-offset:3px}
main{position:relative;z-index:2;flex:1;min-height:0;padding:6px 22px 24px}
.sheet{height:100%;border:3px solid var(--ink);border-radius:22px;background:var(--card);box-shadow:6px 6px 0 var(--shc);overflow:hidden}
object{width:100%;height:100%;border:0;display:block}
.fallback{padding:48px 20px;text-align:center;color:var(--muted);font-weight:700;line-height:1.8}
.fallback .btn{margin-top:14px}
@media (max-width:640px){header{padding:12px 14px;justify-content:center}main{padding:4px 12px 16px}.title{order:-1;width:100%;text-align:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header>
    <a class="btn" href="/">← prahladsingh.in</a>
    <div class="title">Prahlad Singh — <em>Resume</em></div>
    <a class="btn p" href="/prahlad_resume.pdf" download="Prahlad_Singh_Resume.pdf">⬇ Download PDF</a>
  </header>
  <main>
    <div class="sheet">
      <object data="/prahlad_resume.pdf#toolbar=0&navpanes=0" type="application/pdf">
        <div class="fallback">
          Your browser can't preview PDFs, so the download should start automatically.<br>If it doesn't, tap below.<br>
          <a class="btn p" href="/prahlad_resume.pdf" download="Prahlad_Singh_Resume.pdf">⬇ Download resume</a>
        </div>
      </object>
    </div>
  </main>
  <script>
    // If the browser can't preview PDFs inline, download automatically
    (function () {
      var canPreview = navigator.pdfViewerEnabled;
      if (canPreview === undefined) {
        // older browsers: check the plugin/mime lists, and treat mobile as no-preview
        var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        canPreview = !mobile && !!(navigator.mimeTypes && navigator.mimeTypes['application/pdf']);
      }
      if (!canPreview) {
        var a = document.createElement('a');
        a.href = '/prahlad_resume.pdf';
        a.download = 'Prahlad_Singh_Resume.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    })();
  </script>
</body>
</html>
